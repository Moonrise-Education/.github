<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
  <title id="title">Moonrise Education</title>
  <desc id="desc">Former les talents. Construire les compétences de demain. Composition bleu nuit avec un horizon et un disque lunaire.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b30"/>
      <stop offset="1" stop-color="#080e1b"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e1e9f6"/>
      <stop offset="0.55" stop-color="#a6bbd9"/>
      <stop offset="1" stop-color="#546d92"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20314d" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#a6bbd9" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#20314d" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sky"><rect width="1440" height="327"/></clipPath>
  </defs>
  <rect width="1440" height="460" rx="8" fill="url(#background)"/>
  <g fill="none" stroke="#839cc3" stroke-opacity="0.12">
    <circle cx="1152" cy="327" r="273"/>
    <circle cx="1152" cy="327" r="221"/>
    <path d="M1152 35V427"/>
  </g>
  <g clip-path="url(#sky)">
    <circle cx="1152" cy="327" r="156" fill="url(#moon)"/>
  </g>
  <path d="M760 327H1440" stroke="url(#horizon)" stroke-width="1.5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="76" y="69" width="26" height="3" fill="#a6bbd9"/>
    <text x="117" y="77" fill="#a6bbd9" font-size="14" letter-spacing="3">GROUPE D’ÉDUCATION</text>
    <text x="72" y="190" fill="#f4f7fc" font-size="76" font-weight="600" letter-spacing="-3">Moonrise</text>
    <text x="76" y="238" fill="#c1ccde" font-size="29" letter-spacing="7">EDUCATION</text>
    <text x="76" y="314" fill="#eef2f8" font-size="24">Former les talents.</text>
    <text x="76" y="349" fill="#9dacc3" font-size="24">Construire les compétences de demain.</text>
    <text x="76" y="414" fill="#8293ae" font-size="12" letter-spacing="2">ROCKET SCHOOL   /   ÉCOLE GUSTAVE   /   ÉCOLE DU SOIN</text>
  </g>
</svg>
